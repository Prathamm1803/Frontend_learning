<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>University Registration Form</title>
  </head>

  <body>
    <h1>University Registration Form</h1>
    <p>Please fill out the form below to register</p>

    <hr />

    <form>
      <h2>Personal Details</h2>

      <label for="name">First Name:</label>
      <input
        type="text"
        name="firstName"
        id="name"
        placeholder="e.g. Arjun"
        required
      />

      <br /><br />

      <label for="surname">Last Name:</label>
      <input
        type="text"
        name="lastName"
        id="surname"
        placeholder="e.g. Singh"
        required
      />

      <br /><br />

      <label for="dob">Date of Birth:</label>
      <input type="date" name="dob" id="dob" required />

      <br /><br />

      <label>Gender:</label>

      <br />

      <label for="male">Male</label>
      <input type="radio" name="gender" id="male" value="male" required />

      <br />

      <label for="female">Female</label>
      <input type="radio" name="gender" id="female" value="female" />

      <br />

      <label for="other">Other</label>
      <input type="radio" name="gender" id="other" value="other" />

      <br /><br />

      <label for="photo">Upload Your Photo:</label>

      <br />

      <input type="file" name="photo" id="photo" accept="image/*" />

      <hr />

      <h2>Contact Information</h2>

      <label for="email">Email Address:</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="your@example.com"
        required
      />

      <br /><br />

      <label for="num">Phone Number:</label>
      <input
        type="tel"
        id="num"
        name="phoneNumber"
        placeholder="e.g. 9876543210"
        required
      />

      <br /><br />

      <label for="address">Mailing Address:</label>

      <br />

      <textarea
        name="address"
        id="address"
        rows="5"
        cols="30"
        placeholder="Street Address, City, State, ZIP Code"
      ></textarea>

      <hr />

      <h2>Academic Information</h2>

      <label for="course">Select Your Course:</label>

      <br />

      <select name="course" id="course" required>
        <option value="">--Choose a Course--</option>
        <option value="CSE">CSE</option>
        <option value="CCE">CCE</option>
        <option value="ECE">ECE</option>
        <option value="ME">ME</option>
      </select>

      <br /><br />

      <label>Extracurricular Interests:</label>

      <br />

      <label for="sports">Sports</label>
      <input type="checkbox" name="interest" id="sports" value="sports" />

      <br />

      <label for="arts">Music & Arts</label>
      <input type="checkbox" name="interest" id="arts" value="arts" />

      <br />

      <label for="tech">Technology Clubs</label>
      <input type="checkbox" name="interest" id="tech" value="technology" />

      <br />

      <label for="volunteering">Volunteering</label>
      <input
        type="checkbox"
        name="interest"
        id="volunteering"
        value="volunteering"
      />

      <hr />

      <h2>Create Your Account</h2>

      <label for="password">Create a Password:</label>
      <input type="password" id="password" name="password" required />

      <br /><br />

      <label for="security">Security Question:</label>

      <select name="securityQuestion" id="security">
        <option value="pet">What was your first pet's name?</option>

        <option value="school">What was the name of your first school?</option>

        <option value="city">In which city were you born?</option>

        <option value="teacher">Who was your favorite teacher?</option>
      </select>

      <br /><br />

      <label for="secans">Security Answer:</label>
      <input type="text" id="secans" name="securityAnswer" />

      <br /><br />

      <input
        type="checkbox"
        id="tnc"
        name="termsAccepted"
        value="yes"
        required
      />

      <label for="tnc"> I agree to the Terms and Conditions </label>

      <br /><br />

      <button type="submit">Register</button>

      <button type="reset">Clear Form</button>
    </form>
  </body>
</html>
