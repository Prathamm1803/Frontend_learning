<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Positioning</title>
    <style>
      body {
        margin: 50px;
        height: 3000px;
      }
      .box {
        width: 150px;
        padding: 20px;
        border: 2px solid black;
        background-color: lightblue;
        margin: 10px;
      }
      /* Static */
      .static {
        position: static;
      }
      /* Relative */
      .relative {
        position: relative;
        top: 20px;
        left: 30px;
        background-color: lightgreen;
      }
      /* Absolute */
      .parent {
        position: relative;
        height: 250px;
        border: 3px solid black;
        margin-bottom: 30px;
      }
      .absolute {
        position: absolute;
        top: 20px;
        right: 20px;
        background-color: lightcoral;
      }
      /* Sticky */
      .sticky {
        position: sticky;
        top: 0;
        background-color: gold;
        z-index: 3;
      }
      /* Fixed */
      .fixed {
        position: fixed;
        top: 0px;
        right: 20px;
        width: 300px;
        background-color: orange;
      }
      .z-container {
        position: relative;
        height: 300px;
      }
      .z-box {
        width: 150px;
        height: 150px;
        position: absolute;
        padding: 10px;
        border: 2px solid black;
      }
      .z-box1 {
        background-color: lightblue;
        top: 30px;
        left: 30px;
        z-index: 2;
      }
      .z-box2 {
        background-color: lightpink;
        top: 80px;
        left: 80px;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <h1>CSS Positioning</h1>

    <h2>1. Static</h2>
    <div class="static box">Static Box</div>

    <hr />

    <h2>2. Relative</h2>
    <div class="relative box">Relative Box</div>

    <hr />

    <h2>3. Absolute</h2>
    <div class="parent">
      Parent Container
      <div class="absolute box">Absolute Box</div>
    </div>

    <hr />

    <h2>4. Sticky</h2>
    <div class="sticky box">Sticky Box</div>

    <p>Scroll the page to see sticky and fixed behaviour</p>

    <hr />

    <h2>5. Z-index</h2>
    <div class="z-container">
      <div class="z-box z-box1">Box 1 (z-index: 2)</div>
      <div class="z-box z-box2">Box 2 (z-index: 1)</div>
    </div>

    <hr />

    <h2>6. Fixed</h2>
    <div class="fixed box">Fixed Box (Like Navigation Bar)</div>
  </body>
</html>
