<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Laos Flag</title>
    <style>
      #square-1 {
        height: 500px;
        width: 700px;
        background-color: red;
        position: relative;
      }
      #square-2 {
        height: 250px;

      #circle-1 {
        height: 210px;
        width: 210px;
        border-radius: 50%;
        background-color: white;
        position: absolute;
        top: 20px;
        left: 245px;
      }
    </style>
  </head>
  <body style="background-color: black">
    <div id="square-1">
      <div id="square-2">
        <div id="circle-1"></div>
      </div>
    </div>
