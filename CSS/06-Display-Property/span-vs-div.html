<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Span vs Div</title>
    <style>
      .highlight {
        color: red;
        font-weight: bold;
      }
      .box {
        background-color: lightblue;
        padding: 10px;
        margin: 10px 0;
      }
    </style>
  </head>
  <body>
    <h1>Span vs Div</h1>
    <h2>Using Span</h2>
    <p>
      I am learning <span class="highlight">HTML</span> and
      <span class="highlight">CSS</span>
    </p>
    <h2>Using Div</h2>
    <div class="box">First Div</div>
    <div class="box">Second Div</div>
  </body>
</html>
