<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Grid Demo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>CSS Grid Properties</h1>

    <h2>1. Basic Grid (3 coloumns)</h2>
    <div class="grid basic-grid">
      <div class="box">1</div>
      <div class="box">2</div>
      <div class="box">3</div>
      <div class="box">4</div>
      <div class="box">5</div>
      <div class="box">6</div>
    </div>

    <hr />

    <h2>2. Fraction Unit</h2>
    <div class="grid fr-grid">
      <div class="box">1fr</div>
      <div class="box">2fr</div>
      <div class="box">1fr</div>
    </div>

    <hr />

    <h2>3. Grid Rows</h2>
    <div class="grid row-grid">
      <div class="box">A</div>
      <div class="box">B</div>
      <div class="box">C</div>
      <div class="box">D</div>
    </div>

    <hr />

    <h2>4. Repeat Functions</h2>
    <div class="grid repeat-grid">
      <div class="box">1</div>
      <div class="box">2</div>
      <div class="box">3</div>
      <div class="box">4</div>
    </div>

    <hr />

    <h2>5. Grid Colloumn Span</h2>
    <div class="grid span-grid">
      <div class="box span-two">Span 2 coloumns</div>
      <div class="box">2</div>
      <div class="box">3</div>
      <div class="box">4</div>
      <div class="box">5</div>
    </div>

    <hr />

    <h2>6. Grid Row Span</h2>
    <div class="grid row-span-grid">
      <div class="box row-span">Row Span</div>
      <div class="box">2</div>
      <div class="box">3</div>
      <div class="box">4</div>
      <div class="box">5</div>
    </div>
  </body>
</html>
