<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media Queries Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        font-family: Arial, Helvetica, sans-serif;
      }
      .container {
        width: 400px;
        height: 400px;

        background-color: aqua;

        display: flex;
        justify-content: center;
        align-items: center;

        font-size: 40px;
        font-weight: bold;
      }
      /* Tablet */
      @media screen and (max-width: 768px) {
        .container {
          width: 300px;
          height: 300px;

          background-color: lightgreen;

          font-size: 30px;
        }
      }
      /* Mobile */
      @media screen and (max-width: 480px) {
        .container {
          width: 200px;
          height: 200px;

          background-color: lightcoral;

          font-size: 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">Resize the browser window</div>
  </body>
</html>
