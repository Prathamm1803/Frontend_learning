<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Design</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: Arial, Helvetica, sans-serif;
        padding: 20px;
      }
      h1 {
        text-align: center;
        margin-bottom: 30px;
      }
      .container {
        display: grid;
        /*  Responsive columns
        auto-fit automatically adjusts the number of columns
        minmax(250px, 1fr):
        - Minimum width = 250px
        - Maximum width = available space (1fr)
    */
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        /*  Fixed 4-coloumn layout (not responsive)
        grid-template-columns: repeat(4, 1fr);
    */
        gap: 20px;
      }
      /* Tablets */
      @media (max-width: 768px) {
        .container {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      /* Mobile */
      @media (max-width: 480px) {
        .container {
          grid-template-columns: 1fr;
        }
        .card {
          padding: 15px;
        }
      }
      .card {
        background-color: lightblue;
        border: 2px solid black;
        padding: 20px;
        border-radius: 10px;
      }
      .card h2 {
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <h1>Responsive Card Layout</h1>
    <div class="container">
      <div class="card">
        <h2>Card 1</h2>
        <p>This is a responsive card</p>
      </div>

      <div class="card">
        <h2>Card 2</h2>
        <p>This is a responsive card</p>
      </div>

      <div class="card">
        <h2>Card 3</h2>
        <p>This is a responsive card</p>
      </div>

      <div class="card">
        <h2>Card 4</h2>
        <p>This is a responsive card</p>
      </div>
    </div>
  </body>
</html>
