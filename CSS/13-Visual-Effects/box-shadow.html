<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Box Shadow</title>
    <style>
      * {
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
      }
      body {
        font-family: Arial, Helvetica, sans-serif;

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 30px;
        padding: 40px;
      }
      .card {
        height: 120px;
        width: 250px;

        background-color: white;
        border-radius: 10px;

        display: flex;
        justify-content: center;
        align-items: center;
      }
      /* Syntax: box-shadow: x-offset y-offset blur spread color; */
      /* Simple Shadow */
      .shadow-1 {
        box-shadow: 5px 5px 10px grey;
      }
      /* Larger Blur */
      .shadow-2 {
        box-shadow: 0px 0px 20px gray;
      }
      /* Soft Modern Shadow */
      .shadow-3 {
        box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.25);
      }
      /* Inner Shadow */
      .shadow-4 {
        box-shadow: inset 0px 0px 15px gray;
      }
    </style>
  </head>
  <body>
    <h1>Box Shadow Example</h1>
    <div class="card shadow-1">Shadow-1</div>
    <div class="card shadow-2">Shadow-2</div>
    <div class="card shadow-3">Shadow-3</div>
    <div class="card shadow-4">Inset Shadow</div>
  </body>
</html>
