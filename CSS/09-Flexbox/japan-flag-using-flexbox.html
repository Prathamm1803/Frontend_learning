<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Japan FLag using Flexbox</title>
    <style>
      body {
        height: 1000px;
        display: flex;
        background-color: black;
        justify-content: center;
        align-items: center;
      }
      .container {
        height: 500px;
        width: 700px;
        background-color: white;

        display: flex;

        justify-content: center;
        align-items: center;
      }
      .circle {
        height: 275px;
        width: 275px;
        border-radius: 50%;
        background-color: red;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="circle"></div>
    </div>
  </body>
</html>
